services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://bixi:bixi@postgres:5432/bixi
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: rq worker bixi --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://bixi:bixi@postgres:5432/bixi
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build: .
    command: python -m app.scheduler
    environment:
      INGEST_API_URL: http://api:8000/ingest
      INGEST_INTERVAL_SECONDS: 300
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bixi
      POSTGRES_USER: bixi
      POSTGRES_PASSWORD: bixi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bixi -d bixi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
